<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Workpage: newtab</title>

  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./index.ts"></script>
</head>

<body>
  <header id="header">
    <button class="header__item"><i class="ph ph-gear"></i></button>
  </header>
  <main>
    <section aria-label="Clock" id="clock">
      <h1 class="clock__time"><time class="time"></time></h1>
      <p class="clock__date"><time class="date"></time></p>
    </section>
    <button id="project" popovertarget="project-drawer"></button>
    <div id="project-drawer" popover>
      <ol class="project-drawer__list"></ol>
      <template id="project-item-template">
        <li>
          <button type="text" class="project-drawer__item"></button>
        </li>
      </template>
    </div>
    <section aria-label="Links" id="links">
      <template id="group-template">
        <div class="group-item">
          <div class="group-item__header">
            <h3 class="group-title"></h3>
          </div>
          <ol class="group-links"></ol>
        </div>
      </template>
      <template id="link-template">
        <div class="link-item">
          <ut-options>
            <a></a>
          </ut-options>
        </div>
      </template>

      <ol class="links__group-list">
      </ol>
      <button>Add group</button>
    </section>
  </main>

  <aside class="sidebar">
    <section id="tasks">
      <form>
        <input type="text" placeholder="Add task" />
        <button type="submit">Add</button>
      </form>

      <ol>
        <template id="task-item-template">
          <li>
            <input type="checkbox" />
            <span></span>
          </li>
        </template>
      </ol>
    </section>
    <section id="timer">

    </section>
  </aside>
</body>

</html>
