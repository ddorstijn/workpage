<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Workpage: newtab</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="/node_modules/modern-normalize/modern-normalize.css">
  <script type="module" src="./index.ts"></script>
</head>

<body>
  <header id="header">
    <button id="open-settings" class="header__item clear"><i class="ph ph-gear"></i></button>
  </header>
  <main>
    <section aria-label="Clock" id="clock">
      <h1 class="clock__time"><time class="time"></time></h1>
      <p class="clock__date"><time class="date"></time></p>
    </section>

    <section aria-label="Project" id="project">
      <button id="project-button" popovertarget="project-drawer">
        <span id="project-title"></span>
        <i class="ph ph-caret-down"></i>
      </button>
      <div id="project-drawer" popover>
        <ol id="project-list"></ol>
        <template id="project-item-template">
          <li class="project-item">
            <button class="project-item__btn clear" popovertarget="project-drawer" popovertargetaction="hide">
              <span class="project-item__title"></span>
              <span class="project-item__used"></span>
            </button>
            <div class="options">
              <button class="clear">
                <i class="ph ph-pen"></i>
              </button>
              <button class="clear">
                <i class="ph ph-trash-simple"></i>
              </button>
            </div>
          </li>
        </template>
      </div>
    </section>

    <section aria-label="Links" id="links">
      <template id="group-template">
        <li class="group-item">
          <div class="group-item__header">
            <h2 class="group-title"></h2>
          </div>
          <ol class="group-links"></ol>
        </li>
      </template>
      <template id="link-template">
        <li class="link-item">
          <a></a>
        </li>
      </template>

      <ol id="group-list">
      </ol>
    </section>
  </main>

  <aside class="sidebar">
    <section id="tasks">
      <form id="add-task-form">
        <input type="text" placeholder="Add task" />
        <button type="submit">Add</button>
      </form>

      <ol id="task-list">
      </ol>
      <template id="task-item-template">
        <li class="task-item">
          <input type="checkbox" />
          <span class="task-title"></span>
        </li>
      </template>
    </section>
    <section id="timer">
    </section>
  </aside>
</body>

</html>
