<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Workpage: newtab</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="/node_modules/modern-normalize/modern-normalize.css">
  <script type="module" src="./index.ts"></script>
</head>

<body>
  <header id="header">
    <button id="open-settings" class="header__item clear"><i class="ph-fill ph-gear"></i></button>
  </header>
  <main>
    <section aria-label="Clock" id="clock">
      <h1 class="clock__time"><time class="time"></time></h1>
      <p class="clock__date"><time class="date"></time></p>
    </section>

    <section aria-label="Project" id="project">
      <button id="project-button" popovertarget="project-drawer">
        <span id="project-title"></span>
        <i class="ph ph-caret-down"></i>
      </button>
      <div id="project-drawer" popover>
        <header>
          <h2>Projects</h2>
          <div class="toolbar">
            <label class="expand-search">
              <input id="project-search" type="search" placeholder="Search project" />
              <i class="ph ph-magnifying-glass"></i>
            </label>
            <label id="add-project-btn" class="toggle" aria-controls="add-project-form">
              <input type="checkbox" />
              <i class="open ph ph-plus"></i>
              <i class="close ph ph-minus"></i>
              new
            </label>
          </div>
        </header>

        <div id="add-project-form" class="card">
          <form>
            <input id="project-new" type="text" placeholder="New project" />
            <button type="submit">Add</button>
          </form>
        </div>

        <ol id="project-list"></ol>
        <template id="project-item-template">
          <li class="project-item">
            <div class="project-item__content">
              <input type="text" class="project-item__input hidden" />
              <button class="project-item__title" popovertarget="project-drawer" popovertargetaction="hide"></button>
              <span class="project-item__used"></span>
            </div>
            <div class="options">
              <button class="clear edit">
                <i class="ph-fill ph-pen"></i>
              </button>
              <button class="clear delete">
                <i class="ph-fill ph-trash-simple"></i>
              </button>
            </div>
          </li>
        </template>
      </div>
    </section>

    <section aria-label="Links" id="links">
      <template id="group-template">
        <li class="group-item">
          <div class="group-item__header">
            <h2 class="group-title"></h2>
          </div>
          <ol class="group-links"></ol>
        </li>
      </template>
      <template id="link-template">
        <li class="link-item">
          <a></a>
        </li>
      </template>

      <ol id="group-list">
      </ol>
    </section>
  </main>

  <aside class="sidebar">
    <section id="tasks">
      <header>
        <h2>Tasks</h2>

        <div class="toolbar">
          <label class="expand-search">
            <input id="task-search" type="search" placeholder="Search task" />
            <i class="ph ph-magnifying-glass"></i>
          </label>
          <label id="add-task-btn" class="toggle" aria-controls="add-task-form">
            <input type="checkbox" />
            <i class="open ph ph-plus"></i>
            <i class="close ph ph-minus"></i>
            new
          </label>
        </div>
      </header>

      <div id="add-task-form" class="card">
        <form>
          <input id="task-new" type="text" placeholder="New task" />
          <button type="submit">Add</button>
        </form>
      </div>

      <ol id="task-list">
      </ol>
      <template id="task-item-template">
        <li class="task-item card">
          <label class="checkbox">
            <input type="checkbox" />
            <span class="unchecked"><i class="ph ph-circle"></i></span>
            <span class="checked"><i class="ph ph-check-circle"></i></span>
          </label>
          <span class="task-title"></span>
          <textarea name="task-textarea" class="task-textarea hidden"></textarea>
          <div class="options">
            <button class="clear edit">
              <i class="ph-fill ph-pen"></i>
            </button>
            <button class="clear delete">
              <i class="ph-fill ph-trash-simple"></i>
            </button>
          </div>
        </li>
      </template>
    </section>
    <section id="timer">
    </section>
  </aside>
</body>

</html>
